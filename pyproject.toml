[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pySimplePID"
version = "0.1.0"
description = "A small deterministic PID controller library for Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]
